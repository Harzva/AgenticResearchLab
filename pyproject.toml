[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-lab"
version = "0.2.0"
description = "Turn projects and topics into evidence-grounded agentic research directions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Harzva"}]
keywords = ["agentic-ai", "research", "papers", "mobile-agent", "gui-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://harzva.github.io/AgenticResearchLab/"
Repository = "https://github.com/Harzva/AgenticResearchLab"
Issues = "https://github.com/Harzva/AgenticResearchLab/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]
fulltext = ["PyMuPDF>=1.24"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
arl = "agentic_research_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_research_lab = ["data/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
