name: GitHub Pages

on:
  push:
    branches:
      - main
      - agent/comprehensive-upgrade
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_pages.py --output _site
      - run: python -c "import json, pathlib; p=pathlib.Path('_site'); d=json.loads((p/'data/catalog.json').read_text()); assert d['summary']['papers']==1242; assert (p/'.nojekyll').is_file()"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
