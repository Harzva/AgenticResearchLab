name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: arl index-build --store /tmp/arl-ci.sqlite3
      - run: arl eval-validate smoke --require-ready
      - run: arl eval-validate human
      - run: arl evaluate --store /tmp/arl-ci.sqlite3 --output /tmp/arl-metrics.json
      - run: python scripts/validate_repository.py
      - run: python scripts/check_public_safety.py
      - run: python scripts/build_pages.py --output /tmp/arl-pages
      - run: python scripts/check_pages_artifact.py --root /tmp/arl-pages
      - run: python -m build
      - run: python -c "import zipfile; p=next(__import__('pathlib').Path('dist').glob('*.whl')); z=zipfile.ZipFile(p); assert any(n.endswith('conference_agent_papers_2026.json') for n in z.namelist()); assert not any(n.endswith(('.pdf', '.sqlite3')) for n in z.namelist())"
